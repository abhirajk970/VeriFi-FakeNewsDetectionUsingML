<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #63af4c;
            margin-bottom: 20px;
            font-size: 28px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #f4f4f9;
        }

        .fake {
            color: #d9534f;
            font-weight: bold;
        }

        .real {
            color: #5cb85c;
            font-weight: bold;
        }

        .articles {
            margin-top: 20px;
            text-align: left;
        }

        .articles h3 {
            margin-bottom: 10px;
        }

        .articles ul {
            list-style: none;
            padding: 0;
        }

        .articles li {
            margin-bottom: 10px;
        }

        .articles a {
            text-decoration: none;
            color: #007BFF;
        }

        .articles a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake News Detector</h1>
        <form action="/predict" method="POST">
            <label for="news">Enter News Article:</label><br>
            <input type="text" id="news" name="news" placeholder="Type news here"><br><br>
            <input type="submit" value="Check">
        </form>
        <div class="result">
            {% if prediction_text %}
                <p class="{{ 'fake' if 'Fake' in prediction_text else 'real' }}">{{ prediction_text }}</p>
            {% endif %}
        </div>
        <div class="articles">
            {% if articles %}
                <h3>Related Articles:</h3>
                <ul>
                    {% for article in articles %}
                        <li><a href="{{ article.url }}" target="_blank">{{ article.title }}</a></li>
                    {% endfor %}
                </ul>
            {% endif %}
        </div>
        <footer>
            <p>Powered by Machine Learning</p>
        </footer>
    </div>
</body>
</html>
